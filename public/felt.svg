<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360">
  <filter id="felt" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="4" seed="11"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.085" intercept="0"/>
    </feComponentTransfer>
  </filter>
  <rect width="360" height="360" filter="url(#felt)"/>
</svg>
